<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS Upload</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="card">
      <h2>Plik txt z towarami</h2>
      <form id="upload-form">
        <div class="form-group">
          <label for="file-input-goods">Plik z towarami:</label>
          <input type="file" id="file-input-goods" accept=".txt" />
          <div id="file-info-goods">Wybierz plik z dysku...</div>
        </div>

        <div class="form-group">
          <label for="file-input-names">Plik z nazwami</label>
          <input type="file" id="file-input-names" accept=".txt" />
          <div id="file-info-names">Wybierz plik z dysku...</div>
        </div>

        <!-- <div class="form-group">
          <label for="file-input">Plik tekstowy:</label>
          <input type="file" id="file-input" accept=".txt" />
          <div id="file-info">Wybierz plik z dysku...</div>
        </div> -->

        <button type="submit">Wyślij na serwer</button>
      </form>
    </div>

    <div class="card">
      <h2>Połącz towary i nazwy do jednego pliku</h2>

      <form id="form-merge">
        <button type="submit">Połącz</button>
      </form>
    </div>

    <div class="card">
      <h2>Wyszukaj towar</h2>
      <form id="form-search">
        <input
          type="text"
          id="search-symbol"
          placeholder="Wpisz Symbol..."
          required
        />
        <button type="submit">Szukaj</button>
      </form>

      <div id="search-results" style="margin-top: 15px"></div>
    </div>

    <div class="card">
      <h2>Plik txt z kontrahentami</h2>
      <form id="upload-form-contractors">
        <div class="form-group">
          <label for="file-input-contractors">Plik z kontrahentami:</label>
          <input type="file" id="file-input-contractors" accept=".txt" />
          <div id="file-info-contractors">Wybierz plik z dysku...</div>
        </div>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
